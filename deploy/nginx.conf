# /etc/nginx/sites-available/datapprove-frontend   (symlink into sites-enabled)
# After first install run:  sudo certbot --nginx -d data.mednevo.com --redirect
#
# Serves the built React app and proxies /api/ to the datapprove backend on the
# same VPS (gunicorn unix socket), so the browser sees ONE origin:
#   - no CORS needed
#   - one basic-auth login covers the UI, API calls and file/zip downloads

server {
    listen 80;
    listen [::]:80;
    server_name data.mednevo.com;

    root  /home/ubuntu/apps/mednevo/symptom_checker/frontend/current;
    index index.html;

    client_max_body_size 20m;

    access_log /var/log/nginx/datapprove-frontend.access.log;
    error_log  /var/log/nginx/datapprove-frontend.error.log;

    # Same doctor accounts as the backend
    auth_basic           "Mednevo data review";
    auth_basic_user_file /etc/nginx/.htpasswd-datapprove;

    # Let's Encrypt HTTP-01 challenge must stay reachable without auth
    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/html;
    }

    # API -> Django backend (same server)
    location /api/ {
        proxy_pass         http://unix:/run/datapprove/gunicorn.sock;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_redirect     off;
    }

    # Vite hashed bundles: cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html: always revalidate so new deploys show up immediately
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
